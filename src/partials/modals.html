<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Entrar</h2>
            <button class="modal-close" onclick="closeModal('loginModal')" aria-label="Fechar modal">&times;</button>
        </div>
        <div class="modal-body">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail" class="form-label">E-mail</label>
                    <input type="email" id="loginEmail" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword" class="form-label">Senha</label>
                    <input type="password" id="loginPassword" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="loginType" class="form-label">Tipo de Usuário</label>
                    <select id="loginType" class="form-input form-select" required>
                        <option value="">Selecione...</option>
                        <option value="resident">Morador</option>
                        <option value="admin">Síndico/Administrador</option>
                        <option value="provider">Prestador de Serviços</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    Entrar
                </button>
                <button type="button" class="btn btn-outline" style="width: 100%; margin-bottom: 1rem;" onclick="loginWithGoogle()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Entrar com Google
                </button>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="#" onclick="showRegisterModal(); closeModal('loginModal');" style="color: var(--primary);">Não tem conta? Cadastre-se</a>
                </p>
            </form>
        </div>
    </div>
</div>

<!-- Register Modal -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Cadastrar</h2>
            <button class="modal-close" onclick="closeModal('registerModal')" aria-label="Fechar modal">&times;</button>
        </div>
        <div class="modal-body">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerName" class="form-label">Nome Completo</label>
                    <input type="text" id="registerName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail" class="form-label">E-mail</label>
                    <input type="email" id="registerEmail" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="registerPhone" class="form-label">Telefone</label>
                    <input type="tel" id="registerPhone" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="registerType" class="form-label">Tipo de Usuário</label>
                    <select id="registerType" class="form-input form-select" required>
                        <option value="">Selecione...</option>
                        <option value="resident">Morador</option>
                        <option value="admin">Síndico/Administrador</option>
                        <option value="provider">Prestador de Serviços</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="registerUnit" class="form-label">Unidade (apenas moradores)</label>
                    <input type="text" id="registerUnit" class="form-input" placeholder="Ex: Apto 201 - Bloco A">
                </div>
                <div class="form-group">
                    <label for="registerPassword" class="form-label">Senha</label>
                    <input type="password" id="registerPassword" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="registerConfirmPassword" class="form-label">Confirmar Senha</label>
                    <input type="password" id="registerConfirmPassword" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    Cadastrar
                </button>
                <p style="text-align: center; margin-top: 1rem;">
                    <a href="#" onclick="showLoginModal(); closeModal('registerModal');" style="color: var(--primary);">Já tem conta? Faça login</a>
                </p>
            </form>
        </div>
    </div>
</div>

<!-- Create Modal -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="createModalTitle">Criar</h2>
            <button class="modal-close" onclick="closeModal('createModal')" aria-label="Fechar modal">&times;</button>
        </div>
        <div class="modal-body" id="createModalBody">
            <!-- Content will be dynamically loaded -->
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast">
    <div id="toastIcon"></div>
    <div>
        <div id="toastTitle" style="font-weight: 600;"></div>
        <div id="toastMessage" style="font-size: 0.875rem; color: var(--gray-600);"></div>
    </div>
</div>
